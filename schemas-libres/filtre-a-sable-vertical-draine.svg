<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="titre desc" font-family="Public Sans, Arial, Helvetica, sans-serif"><title id="titre">Filtre à sable vertical drainé</title><desc id="desc">Coupe et vue en plan d'un filtre à sable vertical drainé : fosse toutes eaux, regard de répartition, tuyaux d'épandage dans une couche de graviers, massif de sable propre rapporté, drains de collecte à la base placés en alternance avec les tuyaux distributeurs, regard de collecte et rejet vers le point de rejet validé. Surface d'au moins 5 m² par pièce principale et d'au moins 20 m² au total, pour un sol de perméabilité inférieure à 15 mm/h.</desc><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><cc:Work rdf:about="https://monvidangeur.fr/schemas-libres/filtre-a-sable-vertical-draine.svg"><dc:title>Filtre à sable vertical drainé</dc:title><dc:creator><cc:Agent><dc:title>Mon Vidangeur – monvidangeur.fr</dc:title></cc:Agent></dc:creator><dc:source>arrêté du 7/09/2009 modifié, annexe 1 (« Filtre à sable vertical drainé ») ; guide des usagers de l'ANC (2012), fiche 9-2</dc:source><dc:language>fr</dc:language><cc:license rdf:resource="https://creativecommons.org/licenses/by/4.0/"/><cc:attributionName>Mon Vidangeur – monvidangeur.fr</cc:attributionName><cc:attributionURL rdf:resource="https://monvidangeur.fr/schemas-libres/filtre-a-sable-vertical-draine/"/></cc:Work></rdf:RDF></metadata><defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1747a6"/></marker><marker id="c" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#4a5868" stroke-width="1.5"/></marker><pattern id="grav" width="14" height="12" patternUnits="userSpaceOnUse"><rect width="14" height="12" fill="#b8b8b0"/><circle cx="4" cy="4" r="2.4" fill="#8a8a82"/><circle cx="11" cy="9" r="2" fill="#8a8a82"/></pattern><pattern id="sab" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#f3e2a6"/><circle cx="2" cy="3" r="1" fill="#b89b4a"/><circle cx="6.5" cy="7" r="1" fill="#b89b4a"/></pattern></defs><rect width="960" height="640" fill="#ffffff"/><rect x="0" y="0" width="960" height="52" fill="#0b1f3a" stroke="none" stroke-width="0"/><text x="24" y="34" font-size="22" text-anchor="start" font-weight="bold" fill="#ffffff">Filtre à sable vertical drainé</text><rect x="810" y="14" width="126" height="24" rx="12" fill="#ffc233"/><text x="873" y="31" font-size="12" text-anchor="middle" font-weight="bold" fill="#0b1f3a">Schéma de principe</text><rect x="0" y="150" width="620" height="444" fill="#e9dcc3" stroke="none" stroke-width="0"/><line x1="0" y1="150" x2="620" y2="150" stroke="#6b8f3a" stroke-width="4"/><rect x="20" y="170" width="120" height="110" fill="#d9dee5" stroke="#0b1f3a" stroke-width="3"/><rect x="23" y="190" width="114" height="87" fill="#cfe3f5" stroke="none" stroke-width="0"/><rect x="23" y="190" width="114" height="9" fill="#a58f6a" stroke="none" stroke-width="0"/><rect x="23" y="255" width="114" height="22" fill="#7a5c3e" stroke="none" stroke-width="0"/><line x1="42" y1="170" x2="42" y2="230" stroke="#0b1f3a" stroke-width="3"/><line x1="118" y1="170" x2="118" y2="230" stroke="#0b1f3a" stroke-width="3"/><rect x="88" y="202" width="26" height="50" fill="#8d8072" stroke="#0b1f3a" stroke-width="1.5" stroke-dasharray="4 3"/><text x="80" y="300" font-size="12" text-anchor="middle" font-weight="bold" fill="#0b1f3a" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">fosse toutes eaux</text><polyline points="140,202 170,202" fill="none" stroke="#0b1f3a" stroke-width="5"/><rect x="170" y="146" width="30" height="70" fill="#d9dee5" stroke="#0b1f3a" stroke-width="2"/><text x="185" y="120" font-size="11" text-anchor="middle" font-weight="normal" fill="#4a5868" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"><tspan x="185" dy="0">regard de</tspan><tspan x="185" dy="13.8">répartition</tspan></text><rect x="200" y="150" width="340" height="28" fill="#c9b48f" stroke="none" stroke-width="0"/><rect x="200" y="178" width="340" height="34" fill="url(#grav)" stroke="none" stroke-width="0"/><rect x="200" y="189.0" width="340" height="12" fill="#ffffff" stroke="#0b1f3a" stroke-width="1.5"/><circle cx="210" cy="199.0" r="1.6" fill="#0b1f3a"/><circle cx="228" cy="199.0" r="1.6" fill="#0b1f3a"/><circle cx="246" cy="199.0" r="1.6" fill="#0b1f3a"/><circle cx="264" cy="199.0" r="1.6" fill="#0b1f3a"/><circle cx="282" cy="199.0" r="1.6" fill="#0b1f3a"/><circle cx="300" cy="199.0" r="1.6" fill="#0b1f3a"/><circle cx="318" cy="199.0" r="1.6" fill="#0b1f3a"/><circle cx="336" cy="199.0" r="1.6" fill="#0b1f3a"/><circle cx="354" cy="199.0" r="1.6" fill="#0b1f3a"/><circle cx="372" cy="199.0" r="1.6" fill="#0b1f3a"/><circle cx="390" cy="199.0" r="1.6" fill="#0b1f3a"/><circle cx="408" cy="199.0" r="1.6" fill="#0b1f3a"/><circle cx="426" cy="199.0" r="1.6" fill="#0b1f3a"/><circle cx="444" cy="199.0" r="1.6" fill="#0b1f3a"/><circle cx="462" cy="199.0" r="1.6" fill="#0b1f3a"/><circle cx="480" cy="199.0" r="1.6" fill="#0b1f3a"/><circle cx="498" cy="199.0" r="1.6" fill="#0b1f3a"/><circle cx="516" cy="199.0" r="1.6" fill="#0b1f3a"/><circle cx="534" cy="199.0" r="1.6" fill="#0b1f3a"/><rect x="200" y="212" width="340" height="110" fill="url(#sab)" stroke="none" stroke-width="0"/><rect x="200" y="322" width="340" height="34" fill="url(#grav)" stroke="none" stroke-width="0"/><circle cx="240" cy="340" r="7" fill="#ffffff" stroke="#0b1f3a" stroke-width="2"/><circle cx="330" cy="340" r="7" fill="#ffffff" stroke="#0b1f3a" stroke-width="2"/><circle cx="420" cy="340" r="7" fill="#ffffff" stroke="#0b1f3a" stroke-width="2"/><circle cx="510" cy="340" r="7" fill="#ffffff" stroke="#0b1f3a" stroke-width="2"/><line x1="200" y1="150" x2="200" y2="356" stroke="#0b1f3a" stroke-width="2"/><line x1="540" y1="150" x2="540" y2="356" stroke="#0b1f3a" stroke-width="2"/><line x1="200" y1="356" x2="540" y2="356" stroke="#0b1f3a" stroke-width="2"/><rect x="540" y="270" width="30" height="100" fill="#d9dee5" stroke="#0b1f3a" stroke-width="2"/><text x="555" y="388" font-size="11" text-anchor="middle" font-weight="normal" fill="#4a5868" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"><tspan x="555" dy="0">regard de</tspan><tspan x="555" dy="13.8">collecte</tspan></text><polyline points="570,340 612,340" fill="none" stroke="#1747a6" stroke-width="3" marker-end="url(#fl)"/><text x="612" y="420" font-size="11" text-anchor="end" font-weight="bold" fill="#1747a6" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"><tspan x="612" dy="0">vers le point</tspan><tspan x="612" dy="13.8">de rejet validé</tspan></text><text x="210" y="168" font-size="11" text-anchor="start" font-weight="bold" fill="#0b1f3a" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">terre de recouvrement</text><text x="210" y="187" font-size="11" text-anchor="start" font-weight="bold" fill="#0b1f3a" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">graviers + tuyaux d'épandage (répartition)</text><text x="210" y="270" font-size="11" text-anchor="start" font-weight="bold" fill="#0b1f3a" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"><tspan x="210" dy="0">massif de sable propre rapporté</tspan><tspan x="210" dy="13.8">(sol reconstitué)</tspan></text><text x="210" y="333" font-size="11" text-anchor="start" font-weight="bold" fill="#0b1f3a" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">drainage à la base (drains de collecte)</text><text x="24" y="460" font-size="12" text-anchor="start" font-weight="normal" fill="#1c2733" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"><tspan x="24" dy="0">Cas d'usage : sol en place de perméabilité inférieure à 15 mm/h.</tspan><tspan x="24" dy="15.0">Surface du lit filtrant ≥ 5 m² par pièce principale, minimum 20 m².</tspan><tspan x="24" dy="15.0">Nappe trop proche : épandage au sommet d'un tertre réalisé au-dessus du sol en place.</tspan></text><text x="650" y="96" font-size="13" text-anchor="start" font-weight="bold" fill="#0b1f3a" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Vue en plan</text><rect x="650" y="110" width="280" height="300" fill="url(#sab)" stroke="none" stroke-width="0"/><rect x="650" y="110" width="280" height="300" fill="none" stroke="#0b1f3a" stroke-width="2"/><line x1="685" y1="125" x2="685" y2="395" stroke="#1747a6" stroke-width="5"/><line x1="755" y1="125" x2="755" y2="395" stroke="#1747a6" stroke-width="5"/><line x1="825" y1="125" x2="825" y2="395" stroke="#1747a6" stroke-width="5"/><line x1="895" y1="125" x2="895" y2="395" stroke="#1747a6" stroke-width="5"/><line x1="720" y1="125" x2="720" y2="395" stroke="#7a5c3e" stroke-width="4" stroke-dasharray="10 5"/><line x1="790" y1="125" x2="790" y2="395" stroke="#7a5c3e" stroke-width="4" stroke-dasharray="10 5"/><line x1="860" y1="125" x2="860" y2="395" stroke="#7a5c3e" stroke-width="4" stroke-dasharray="10 5"/><line x1="685" y1="125" x2="895" y2="125" stroke="#1747a6" stroke-width="5"/><text x="650" y="432" font-size="11" text-anchor="start" font-weight="bold" fill="#1747a6" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">━ tuyaux distributeurs (en haut du massif)</text><text x="650" y="450" font-size="11" text-anchor="start" font-weight="bold" fill="#7a5c3e" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"><tspan x="650" dy="0">╍ drains de collecte (à la base), placés</tspan><tspan x="650" dy="13.8">   en alternance avec les distributeurs</tspan></text><rect x="0" y="594" width="960" height="46" fill="#f1f5fb" stroke="none" stroke-width="0"/><line x1="0" y1="594" x2="960" y2="594" stroke="#d5dde1" stroke-width="1"/><text x="24" y="614" font-size="12" text-anchor="start" font-weight="bold" fill="#0b1f3a" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Schéma : Mon Vidangeur – monvidangeur.fr · Licence CC BY 4.0 (réutilisation libre avec ce crédit et un lien)</text><text x="24" y="630" font-size="11" text-anchor="start" font-weight="normal" fill="#4a5868" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Source : arrêté du 7/09/2009 modifié, annexe 1 (« Filtre à sable vertical drainé ») ; guide des usagers de l'ANC (2012), fiche 9-2 · sans échelle sauf mention</text></svg>
