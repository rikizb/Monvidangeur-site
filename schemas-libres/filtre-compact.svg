<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="titre desc" font-family="Public Sans, Arial, Helvetica, sans-serif"><title id="titre">Fosse toutes eaux et filtre compact</title><desc id="desc">Coupe d'une filière fosse toutes eaux avec préfiltre et massif filtrant compact : les eaux prétraitées sont réparties sur un média filtrant (zéolithe, copeaux de coco, laine de roche, sable) placé dans une coque qui l'isole du sol, puis collectées en fond avant évacuation.</desc><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><cc:Work rdf:about="https://monvidangeur.fr/schemas-libres/filtre-compact.svg"><dc:title>Fosse toutes eaux et filtre compact</dc:title><dc:creator><cc:Agent><dc:title>Mon Vidangeur – monvidangeur.fr</dc:title></cc:Agent></dc:creator><dc:source>guide des usagers de l'ANC (ministères, 2012), fiche 9-4 ; arrêté du 7/09/2009 modifié, art. 7</dc:source><dc:language>fr</dc:language><cc:license rdf:resource="https://creativecommons.org/licenses/by/4.0/"/><cc:attributionName>Mon Vidangeur – monvidangeur.fr</cc:attributionName><cc:attributionURL rdf:resource="https://monvidangeur.fr/schemas-libres/filtre-compact/"/></cc:Work></rdf:RDF></metadata><defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1747a6"/></marker><marker id="c" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#4a5868" stroke-width="1.5"/></marker><pattern id="grav" width="14" height="12" patternUnits="userSpaceOnUse"><rect width="14" height="12" fill="#b8b8b0"/><circle cx="4" cy="4" r="2.4" fill="#8a8a82"/><circle cx="11" cy="9" r="2" fill="#8a8a82"/></pattern><pattern id="sab" width="9" height="9" patternUnits="userSpaceOn