<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="titre desc" font-family="Public Sans, Arial, Helvetica, sans-serif"><title id="titre">Micro-station à culture libre (boues activées)</title><desc id="desc">Coupe d'une micro-station à culture libre en trois compartiments : décanteur primaire qui sépare les solides et les flottants et stocke les boues, réacteur biologique aéré par un surpresseur électrique où les bactéries en suspension dégradent la pollution, clarificateur où les boues se séparent de l'eau traitée. Les boues du clarificateur sont recirculées vers le réacteur, les boues en excès sont stockées dans le décanteur primaire.</desc><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><cc:Work rdf:about="https://monvidangeur.fr/schemas-libres/micro-station.svg"><dc:title>Micro-station à culture libre (boues activées)</dc:title><dc:creator><cc:Agent><dc:title>Mon Vidangeur – monvidangeur.fr</dc:title></cc:Agent></dc:creator><dc:source>guide des usagers de l'ANC (ministères, 2012), fiches 9-6 et 9-7 ; arrêté du 7/09/2009 modifié, art. 7</dc:source><dc:language>fr</dc:language><cc:license rdf:resource="https://creativecommons.org/licenses/by/4.0/"/><cc:attributionName>Mon Vidangeur – monvidangeur.fr</cc:attributionName><cc:attributionURL rdf:resource="https://monvidangeur.fr/schemas-libres/micro-station/"/></cc:Work></rdf:RDF></metadata><defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1747a6"/></marker><marker id="c" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#4a5868" stroke-width="1.5"/></marker><pattern id="grav" width="14" height="12" patternUnits="userSpaceOnUse"><rect width="14" height="12" fill="#b8b8b0"/><circle cx="4" cy="4" r="2.4" fill="#8a8a82"/><circle cx="11" cy="9" r="2" fill="#8a8a82"/></pattern><pattern id="sab" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#f3e2a6"/><circle cx="2" cy="3" r="1" fill="#b89b4a"/><circle cx="6.5" cy="7" r="1" fill="#b89b4a"/></pattern></defs><rect width="960" height="640" fill="#ffffff"/><rect x="0" y="0" width="960" height="52" fill="#0b1f3a" stroke="none" stroke-width="0"/><text x="24" y="34" font-size="22" text-anchor="start" font-weight="bold" fill="#ffffff">Micro-station à culture libre (boues activées)</text><rect x="810" y="14" width="126" height="24" rx="12" fill="#ffc233"/><text x="873" y="31" font-size="12" text-anchor="middle" font-weight="bold" fill="#0b1f3a">Schéma de principe</text><rect x="0" y="150" width="960" height="444" fill="#e9dcc3" stroke="none" stroke-width="0"/><line x1="0" y1="150" x2="960" y2="150" stroke="#6b8f3a" stroke-width="4"/><rect x="120" y="180" width="720" height="250" fill="#d9dee5" stroke="#0b1f3a" stroke-width="3"/><rect x="123" y="220" width="224" height="207" fill="#cfe3f5" stroke="none" stroke-width="0"/><rect x="353" y="220" width="254" height="207" fill="#d8ecf9" stroke="none" stroke-width="0"/><rect x="613" y="220" width="224" height="207" fill="#cfe3f5" stroke="none" stroke-width="0"/><rect x="123" y="382" width="224" height="45" fill="#7a5c3e" stroke="none" stroke-width="0"/><rect x="613" y="397" width="224" height="30" fill="#7a5c3e" stroke="none" stroke-width="0"/><line x1="350" y1="180" x2="350" y2="380" stroke="#0b1f3a" stroke-width="3"/><line x1="610" y1="180" x2="610" y2="380" stroke="#0b1f3a" stroke-width="3"/><line x1="380" y1="400" x2="590" y2="400" stroke="#0b1f3a" stroke-width="4"/><circle cx="390" cy="388" r="3" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="427" cy="365" r="4" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="464" cy="342" r="5" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="501" cy="319" r="3" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="538" cy="368" r="4" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="575" cy="345" r="5" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="422" cy="322" r="3" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="459" cy="371" r="4" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="496" cy="348" r="5" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="533" cy="325" r="3" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="570" cy="374" r="4" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="417" cy="351" r="5" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="454" cy="328" r="3" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="491" cy="377" r="4" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="528" cy="354" r="5" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="565" cy="331" r="3" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="412" cy="380" r="4" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="449" cy="357" r="5" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="486" cy="334" r="3" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="523" cy="383" r="4" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="560" cy="360" r="5" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="407" cy="337" r="3" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="444" cy="386" r="4" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="481" cy="363" r="5" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="518" cy="340" r="3" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="555" cy="317" r="4" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="402" cy="366" r="5" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="439" cy="343" r="3" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="476" cy="320" r="4" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="513" cy="369" r="5" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="550" cy="346" r="3" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="397" cy="323" r="4" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="434" cy="372" r="5" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="471" cy="349" r="3" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="508" cy="326" r="4" fill="none" stroke="#1747a6" stroke-width="1.5"/><circle cx="545" cy="375" r="5" fill="none" stroke="#1747a6" stroke-width="1.5"/><rect x="430" y="80" width="100" height="50" fill="#ffc233" stroke="#0b1f3a" stroke-width="2"/><text x="480" y="101" font-size="12" text-anchor="middle" font-weight="bold" fill="#0b1f3a">surpresseur</text><text x="480" y="117" font-size="11" text-anchor="middle" font-weight="normal" fill="#0b1f3a">(électricité)</text><polyline points="480,130 480,195 590,195 590,400" fill="none" stroke="#0b1f3a" stroke-width="3"/><polyline points="20,205 150,205 150,260" fill="none" stroke="#1747a6" stroke-width="3" marker-end="url(#fl)"/><text x="20" y="195" font-size="12" text-anchor="start" font-weight="bold" fill="#1747a6" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">eaux usées brutes</text><polyline points="810,240 810,205 945,205" fill="none" stroke="#1747a6" stroke-width="3" marker-end="url(#fl)"/><text x="945" y="195" font-size="12" text-anchor="end" font-weight="bold" fill="#1747a6" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">eaux traitées</text><polyline points="320,232 380,232" fill="none" stroke="#1747a6" stroke-width="3" marker-end="url(#fl)"/><polyline points="580,232 640,232" fill="none" stroke="#1747a6" stroke-width="3" marker-end="url(#fl)"/><path d="M670,410 C630,470 550,470 530,420" fill="none" stroke="#7a5c3e" stroke-width="3" stroke-dasharray="7 4" marker-end="url(#fl)"/><text x="735" y="460" font-size="11" text-anchor="start" font-weight="bold" fill="#7a5c3e" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"><tspan x="735" dy="0">recirculation des boues</tspan><tspan x="735" dy="13.8">vers le réacteur</tspan></text><path d="M720,415 C720,515 260,515 240,410" fill="none" stroke="#7a5c3e" stroke-width="3" stroke-dasharray="2 4" marker-end="url(#fl)"/><text x="420" y="522" font-size="11" text-anchor="middle" font-weight="bold" fill="#7a5c3e" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">boues en excès stockées dans le décanteur primaire (à vidanger)</text><text x="235.0" y="315" font-size="14" text-anchor="middle" font-weight="bold" fill="#0b1f3a" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">1. Décanteur primaire</text><text x="235.0" y="335" font-size="11" text-anchor="middle" font-weight="normal" fill="#1c2733" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"><tspan x="235.0" dy="0">séparation des solides</tspan><tspan x="235.0" dy="13.8">et des flottants ;</tspan><tspan x="235.0" dy="13.8">stockage des boues</tspan></text><text x="480.0" y="262" font-size="14" text-anchor="middle" font-weight="bold" fill="#0b1f3a" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">2. Réacteur biologique</text><text x="480.0" y="282" font-size="11" text-anchor="middle" font-weight="normal" fill="#1c2733" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"><tspan x="480.0" dy="0">aération forcée : les bactéries</tspan><tspan x="480.0" dy="13.8">en suspension dégradent</tspan><tspan x="480.0" dy="13.8">la pollution</tspan></text><text x="725.0" y="315" font-size="14" text-anchor="middle" font-weight="bold" fill="#0b1f3a" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">3. Clarificateur</text><text x="725.0" y="335" font-size="11" text-anchor="middle" font-weight="normal" fill="#1c2733" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"><tspan x="725.0" dy="0">décantation secondaire :</tspan><tspan x="725.0" dy="13.8">les boues se séparent</tspan><tspan x="725.0" dy="13.8">de l'eau traitée</tspan></text><text x="24" y="570" font-size="11" text-anchor="start" font-weight="normal" fill="#1c2733" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"><tspan x="24" dy="0">Dispositif agréé (dimensionnement, entretien et seuil de vidange : voir son avis d'agrément et son guide d'utilisation).</tspan><tspan x="24" dy="13.8">Variante SBR : réaction biologique et clarification dans un même compartiment, par phases successives.</tspan></text><rect x="0" y="594" width="960" height="46" fill="#f1f5fb" stroke="none" stroke-width="0"/><line x1="0" y1="594" x2="960" y2="594" stroke="#d5dde1" stroke-width="1"/><text x="24" y="614" font-size="12" text-anchor="start" font-weight="bold" fill="#0b1f3a" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Schéma : Mon Vidangeur – monvidangeur.fr · Licence CC BY 4.0 (réutilisation libre avec ce crédit et un lien)</text><text x="24" y="630" font-size="11" text-anchor="start" font-weight="normal" fill="#4a5868" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Source : guide des usagers de l'ANC (ministères, 2012), fiches 9-6 et 9-7 ; arrêté du 7/09/2009 modifié, art. 7 · sans échelle sauf mention</text></svg>
