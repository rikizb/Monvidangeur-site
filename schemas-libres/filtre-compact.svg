0b1f3a"/><circle cx="575" cy="366.0" r="1.6" fill="#0b1f3a"/><circle cx="593" cy="366.0" r="1.6" fill="#0b1f3a"/><circle cx="611" cy="366.0" r="1.6" fill="#0b1f3a"/><circle cx="629" cy="366.0" r="1.6" fill="#0b1f3a"/><circle cx="647" cy="366.0" r="1.6" fill="#0b1f3a"/><circle cx="665" cy="366.0" r="1.6" fill="#0b1f3a"/><circle cx="683" cy="366.0" r="1.6" fill="#0b1f3a"/><circle cx="701" cy="366.0" r="1.6" fill="#0b1f3a"/><circle cx="719" cy="366.0" r="1.6" fill="#0b1f3a"/><circle cx="737" cy="366.0" r="1.6" fill="#0b1f3a"/><circle cx="755" cy="366.0" r="1.6" fill="#0b1f3a"/><polyline points="790,362 940,362" fill="none" stroke="#1747a6" stroke-width="3" marker-end="url(#fl)"/><text x="940" y="382" font-size="12" text-anchor="end" font-weight="bold" fill="#1747a6" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">eaux traitées</text><text x="625.0" y="178" font-size="13" text-anchor="middle" font-weight="bold" fill="#0b1f3a" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Massif filtrant compact dans une coque (isolé du sol)</text><text x="800" y="234" font-size="11" text-anchor="start" font-weight="normal" fill="#4a5868" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">distribution</text><text x="800" y="278" font-size="11" text-anchor="start" font-weight="normal" fill="#4a5868" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"><tspan x="800" dy="0">média filtrant :</tspan><tspan x="800" dy="13.8">zéolithe, copeaux</tspan><tspan x="800" dy="13.8">de coco, laine de</tspan><tspan x="800" dy="13.8">roche, sable…</tspan></text><text x="800" y="340" font-size="11" text-anchor="start" font-weight="normal" fill="#4a5868" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">collecte en fond</text><text x="24" y="440" font-size="12" text-anchor="start" font-weight="normal" fill="#1c2733" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"><tspan x="24" dy="0">Les eaux prétraitées percolent dans le média filtrant, où les bactéries fixées les épurent (culture fixée).</tspan><tspan x="24" dy="15.0">Évacuation selon la perméabilité du sol : infiltration ou irrigation de végétaux non destinés à la consommation humaine ;</tspan><tspan x="24" dy="15.0">à défaut, sur étude particulière, rejet vers le milieu hydraulique superficiel.</tspan><tspan x="24" dy="15.0">Dispositif agréé : dimensionnement, entretien et vidange selon son avis d'agrément et son guide d'utilisation.</tspan></text><rect x="0" y="594" width="960" height="46" fill="#f1f5fb" stroke="none" stroke-width="0"/><line x1="0" y1="594" x2="960" y2="594" stroke="#d5dde1" stroke-width="1"/><text x="24" y="614" font-size="12" text-anchor="start" font-weight="bold" fill="#0b1f3a" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Schéma : Mon Vidangeur – monvidangeur.fr · Licence CC BY 4.0 (réutilisation libre avec ce crédit et un lien)</text><text x="24" y="630" font-size="11" text-anchor="start" font-weight="normal" fill="#4a5868" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Source : guide des usagers de l'ANC (ministères, 2012), fiche 9-4 ; arrêté du 7/09/2009 modifié, art. 7 · sans échelle sauf mention</text></svg>
