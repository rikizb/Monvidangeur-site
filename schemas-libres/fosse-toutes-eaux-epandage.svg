<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="titre desc" font-family="Public Sans, Arial, Helvetica, sans-serif"><title id="titre">Fosse toutes eaux et épandage souterrain</title><desc id="desc">Coupe d'une installation d'assainissement non collectif : habitation, ventilation de la fosse (entrée d'air et sortie d'air en hauteur, diamètre d'au moins 100 mm), fosse toutes eaux d'au moins 3 m³ jusqu'à 5 pièces principales avec préfiltre, regard de répartition, tranchées d'épandage avec tuyaux rigides d'au moins 100 mm dans les graviers, regard de bouclage. Coupe de deux tranchées : largeur d'au moins 0,50 m, fond à 0,60 m en général sans dépasser 1 m, au moins 0,20 m de graviers 10/40, axes espacés d'au moins 1,50 m, au moins 1 m de sol naturel entre deux tranchées.</desc><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><cc:Work rdf:about="https://monvidangeur.fr/schemas-libres/fosse-toutes-eaux-epandage.svg"><dc:title>Fosse toutes eaux et épandage souterrain</dc:title><dc:creator><cc:Agent><dc:title>Mon Vidangeur – monvidangeur.fr</dc:title></cc:Agent></dc:creator><dc:source>arrêté du 7/09/2009 modifié, art. 6 et annexe 1 ; guide des usagers de l'ANC (2012), fiche 9-1</dc:source><dc:language>fr</dc:language><cc:license rdf:resource="https://creativecommons.org/licenses/by/4.0/"/><cc:attributionName>Mon Vidangeur – monvidangeur.fr</cc:attributionName><cc:attributionURL rdf:resource="https://monvidangeur.fr/schemas-libres/fosse-toutes-eaux-epandage/"/></cc:Work></rdf:RDF></metadata><defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1747a6"/></marker><marker id="c" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#4a5868" stroke-width="1.5"/></marker><pattern id="grav" width="14" height="12" patternUnits="userSpaceOnUse"><rect width="14" height="12" fill="#b8b8b0"/><circle cx="4" cy="4" r="2.4" fill="#8a8a82"/><circle cx="11" cy="9" r="2" fill="#8a8a82"/></pattern><pattern id="sab" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#f3e2a6"/><circle cx="2" cy="3" r="1" fill="#b89b4a"/><circle cx="6.5" cy="7" r="1" fill="#b89b4a"/></pattern></defs><rect width="960" height="640" fill="#ffffff"/><rect x="0" y="0" width="960" height="52" fill="#0b1f3a" stroke="none" stroke-width="0"/><text x="24" y="34" font-size="22" text-anchor="start" font-weight="bold" fill="#ffffff">Fosse toutes eaux et épandage souterrain</text><rect x="810" y="14" width="126" height="24" rx="12" fill="#ffc233"/><text x="873" y="31" font-size="12" text-anchor="middle" font-weight="bold" fill="#0b1f3a">Schéma de principe</text><rect x="0" y="235" width="600" height="359" fill="#e9dcc3" stroke="none" stroke-width="0"/><line x1="0" y1="235" x2="600" y2="235" stroke="#6b8f3a" stroke-width="4"/><rect x="30" y="155" width="110" height="80" fill="#ffffff" stroke="#0b1f3a" stroke-width="2"/><polygon points="20,155 85.0,110 150,155" fill="#0b1f3a"/><rect x="73.0" y="195" width="24" height="40" fill="#ffc233" stroke="#0b1f3a" stroke-width="1.5"/><text x="85.0" y="253" font-size="12" text-anchor="middle" font-weight="normal" fill="#4a5868" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Habitation</text><line x1="70" y1="205" x2="70" y2="85" stroke="#4a5868" stroke-width="5"/><text x="10" y="69" font-size="11" text-anchor="start" font-weight="normal" fill="#4a5868" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"><tspan x="10" dy="0">entrée d'air</tspan><tspan x="10" dy="13.8">(ventilation primaire)</tspan></text><polyline points="300,245 300,215 160,215 160,90" fill="none" stroke="#4a5868" stroke-width="5"/><rect x="150" y="76" width="20" height="14" fill="#4a5868" stroke="none" stroke-width="0"/><text x="178" y="85" font-size="11" text-anchor="start" font-weight="normal" fill="#4a5868" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"><tspan x="178" dy="0">sortie d'air (extraction)</tspan><tspan x="178" dy="13.8">en hauteur, Ø ≥ 100 mm</tspan></text><polyline points="120,227 140,227 140,267 192,267" fill="none" stroke="#0b1f3a" stroke-width="5"/><rect x="180" y="255" width="140" height="120" fill="#d9dee5" stroke="#0b1f3a" stroke-width="3"/><rect x="183" y="277" width="134" height="95" fill="#cfe3f5" stroke="none" stroke-width="0"/><rect x="183" y="277" width="134" height="9" fill="#a58f6a" stroke="none" stroke-width="0"/><rect x="183" y="346" width="134" height="26" fill="#7a5c3e" stroke="none" stroke-width="0"/><line x1="202" y1="255" x2="202" y2="317" stroke="#0b1f3a" stroke-width="3"/><line x1="298" y1="255" x2="298" y2="317" stroke="#0b1f3a" stroke-width="3"/><rect x="268" y="289" width="26" height="58" fill="#8d8072" stroke="#0b1f3a" stroke-width="1.5" stroke-dasharray="4 3"/><text x="250" y="400" font-size="14" text-anchor="middle" font-weight="bold" fill="#0b1f3a" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Fosse toutes eaux</text><text x="250" y="418" font-size="11" text-anchor="middle" font-weight="normal" fill="#1c2733" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"><tspan x="250" dy="0">≥ 3 m³ jusqu'à 5 pièces principales,</tspan><tspan x="250" dy="13.8">+ 1 m³ par pièce supplémentaire</tspan></text><text x="345" y="347" font-size="11" text-anchor="start" font-weight="normal" fill="#4a5868" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"><tspan x="345" dy="0">préfiltre</tspan><tspan x="345" dy="13.8">(si nécessaire)</tspan></text><line x1="338" y1="343" x2="296" y2="335" stroke="#4a5868" stroke-width="1"/><polyline points="320,287 372,287" fill="none" stroke="#0b1f3a" stroke-width="5"/><rect x="372" y="231" width="34" height="72" fill="#d9dee5" stroke="#0b1f3a" stroke-width="2"/><text x="389" y="205" font-size="11" text-anchor="middle" font-weight="normal" fill="#4a5868" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"><tspan x="389" dy="0">regard de</tspan><tspan x="389" dy="13.8">répartition</tspan></text><rect x="406" y="285" width="170" height="30" fill="url(#grav)" stroke="none" stroke-width="0"/><rect x="406" y="289.0" width="160" height="12" fill="#ffffff" stroke="#0b1f3a" stroke-width="1.5"/><circle cx="416" cy="299.0" r="1.6" fill="#0b1f3a"/><circle cx="434" cy="299.0" r="1.6" fill="#0b1f3a"/><circle cx="452" cy="299.0" r="1.6" fill="#0b1f3a"/><circle cx="470" cy="299.0" r="1.6" fill="#0b1f3a"/><circle cx="488" cy="299.0" r="1.6" fill="#0b1f3a"/><circle cx="506" cy="299.0" r="1.6" fill="#0b1f3a"/><circle cx="524" cy="299.0" r="1.6" fill="#0b1f3a"/><circle cx="542" cy="299.0" r="1.6" fill="#0b1f3a"/><circle cx="560" cy="299.0" r="1.6" fill="#0b1f3a"/><rect x="566" y="231" width="26" height="84" fill="#d9dee5" stroke="#0b1f3a" stroke-width="2"/><text x="572" y="205" font-size="11" text-anchor="middle" font-weight="normal" fill="#4a5868" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"><tspan x="572" dy="0">regard de</tspan><tspan x="572" dy="13.8">bouclage</tspan></text><line x1="410" y1="333" x2="562" y2="333" stroke="#4a5868" stroke-width="1.5" marker-start="url(#c)" marker-end="url(#c)"/><text x="486.0" y="351.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#0b1f3a" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">une ligne ≤ 30 m</text><text x="410" y="380" font-size="11" text-anchor="start" font-weight="normal" fill="#1c2733" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"><tspan x="410" dy="0">Tuyaux d'épandage rigides Ø ≥ 100 mm,</tspan><tspan x="410" dy="13.8">orifices ≥ 5 mm, posés à l'horizontale ;</tspan><tspan x="410" dy="13.8">longueur totale selon la perméabilité</tspan><tspan x="410" dy="13.8">(test de Porchet ou équivalent)</tspan></text><polyline points="200,525 250,525" fill="none" stroke="#1747a6" stroke-width="3" marker-end="url(#fl)"/><text x="258" y="530" font-size="11" text-anchor="start" font-weight="normal" fill="#1747a6" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">sens d'écoulement des eaux usées</text><text x="30" y="490" font-size="11" text-anchor="start" font-weight="normal" fill="#1c2733" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"><tspan x="30" dy="0">Prétraitement (fosse) puis traitement et évacuation par le sol en place.</tspan><tspan x="30" dy="13.8">Sol apte : perméabilité entre 15 et 500 mm/h sur ≥ 0,70 m ;</tspan><tspan x="30" dy="13.8">pas de nappe à moins de 1 m du fond de fouille (art. 6).</tspan></text><rect x="615" y="70" width="330" height="18" fill="#ffffff" stroke="none" stroke-width="0"/><text x="620" y="84" font-size="13" text-anchor="start" font-weight="bold" fill="#0b1f3a" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Coupe d'une tranchée (échelle : 1 m = 120 px)</text><rect x="615" y="235" width="330" height="359" fill="#e9dcc3" stroke="none" stroke-width="0"/><line x1="615" y1="235" x2="945" y2="235" stroke="#6b8f3a" stroke-width="4"/><rect x="670" y="235" width="60" height="72" fill="#c9b48f" stroke="none" stroke-width="0"/><rect x="670" y="265" width="60" height="42" fill="url(#grav)" stroke="none" stroke-width="0"/><line x1="670" y1="265" x2="730" y2="265" stroke="#3d6b9e" stroke-width="3" stroke-dasharray="6 3"/><circle cx="700" cy="277" r="6" fill="#ffffff" stroke="#0b1f3a" stroke-width="2"/><circle cx="700" cy="282" r="1.5" fill="#0b1f3a"/><line x1="670" y1="235" x2="670" y2="307" stroke="#0b1f3a" stroke-width="1.5"/><line x1="730" y1="235" x2="730" y2="307" stroke="#0b1f3a" stroke-width="1.5"/><line x1="670" y1="307" x2="730" y2="307" stroke="#0b1f3a" stroke-width="1.5"/><line x1="700" y1="205" x2="700" y2="229" stroke="#4a5868" stroke-width="1" stroke-dasharray="3 3"/><rect x="850" y="235" width="60" height="72" fill="#c9b48f" stroke="none" stroke-width="0"/><rect x="850" y="265" width="60" height="42" fill="url(#grav)" stroke="none" stroke-width="0"/><line x1="850" y1="265" x2="910" y2="265" stroke="#3d6b9e" stroke-width="3" stroke-dasharray="6 3"/><circle cx="880" cy="277" r="6" fill="#ffffff" stroke="#0b1f3a" stroke-width="2"/><circle cx="880" cy="282" r="1.5" fill="#0b1f3a"/><line x1="850" y1="235" x2="850" y2="307" stroke="#0b1f3a" stroke-width="1.5"/><line x1="910" y1="235" x2="910" y2="307" stroke="#0b1f3a" stroke-width="1.5"/><line x1="850" y1="307" x2="910" y2="307" stroke="#0b1f3a" stroke-width="1.5"/><line x1="880" y1="205" x2="880" y2="229" stroke="#4a5868" stroke-width="1" stroke-dasharray="3 3"/><line x1="700" y1="217" x2="880" y2="217" stroke="#4a5868" stroke-width="1.5" marker-start="url(#c)" marker-end="url(#c)"/><text x="790.0" y="209.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#0b1f3a" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">entre axes ≥ 1,50 m</text><line x1="670" y1="335" x2="730" y2="335" stroke="#4a5868" stroke-width="1.5" marker-start="url(#c)" marker-end="url(#c)"/><text x="700.0" y="353.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#0b1f3a" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">largeur ≥ 0,50 m</text><line x1="730" y1="255" x2="850" y2="255" stroke="#4a5868" stroke-width="1.5" marker-start="url(#c)" marker-end="url(#c)"/><text x="790.0" y="249.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#0b1f3a" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">≥ 1 m de sol naturel</text><line x1="925" y1="235" x2="925" y2="307" stroke="#4a5868" stroke-width="1.5" marker-start="url(#c)" marker-end="url(#c)"/><text x="925.0" y="271.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#0b1f3a" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"></text><text x="918" y="335" font-size="11" text-anchor="end" font-weight="bold" fill="#0b1f3a" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"><tspan x="918" dy="0">fond à 0,60 m en</tspan><tspan x="918" dy="13.8">général, ≤ 1 m</tspan></text><line x1="842" y1="283" x2="842" y2="307" stroke="#4a5868" stroke-width="1.5" marker-start="url(#c)" marker-end="url(#c)"/><text x="842.0" y="295.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#0b1f3a" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"></text><text x="620" y="395" font-size="11" text-anchor="start" font-weight="normal" fill="#1c2733" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"><tspan x="620" dy="0">— feutre ou protection équivalente perméable</tspan><tspan x="620" dy="13.8">   à l'air et à l'eau, sur les graviers</tspan><tspan x="620" dy="13.8">● graviers lavés 10/40 mm, ≥ 0,20 m en fond</tspan><tspan x="620" dy="13.8">   de tranchée (cote verticale de droite)</tspan><tspan x="620" dy="13.8">○ tuyau d'épandage, orifices vers le bas</tspan></text><rect x="0" y="594" width="960" height="46" fill="#f1f5fb" stroke="none" stroke-width="0"/><line x1="0" y1="594" x2="960" y2="594" stroke="#d5dde1" stroke-width="1"/><text x="24" y="614" font-size="12" text-anchor="start" font-weight="bold" fill="#0b1f3a" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Schéma : Mon Vidangeur – monvidangeur.fr · Licence CC BY 4.0 (réutilisation libre avec ce crédit et un lien)</text><text x="24" y="630" font-size="11" text-anchor="start" font-weight="normal" fill="#4a5868" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Source : arrêté du 7/09/2009 modifié, art. 6 et annexe 1 ; guide des usagers de l'ANC (2012), fiche 9-1 · sans échelle sauf mention</text></svg>
