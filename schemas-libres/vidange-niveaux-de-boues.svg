<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="titre desc" font-family="Public Sans, Arial, Helvetica, sans-serif"><title id="titre">Vidange d'une fosse : niveaux de boues</title><desc id="desc">Coupe d'une fosse toutes eaux en cours de vidange : matières flottantes en surface, zone liquide, boues accumulées au fond, repère de 50 % du volume utile mesuré du fond au niveau inférieur de l'orifice de sortie, tuyau d'aspiration d'un camion de vidange passé par le tampon. La vidange est faite par un vidangeur agréé par le préfet, qui remet un bordereau de suivi.</desc><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:cc="http://creativecommons.org/ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><cc:Work rdf:about="https://monvidangeur.fr/schemas-libres/vidange-niveaux-de-boues.svg"><dc:title>Vidange d'une fosse : niveaux de boues</dc:title><dc:creator><cc:Agent><dc:title>Mon Vidangeur – monvidangeur.fr</dc:title></cc:Agent></dc:creator><dc:source>arrêté du 7/09/2009 modifié (prescriptions techniques), art. 15 et annexe 1 ; arrêté du 7/09/2009 modifié (agrément des vidangeurs), art. 9</dc:source><dc:language>fr</dc:language><cc:license rdf:resource="https://creativecommons.org/licenses/by/4.0/"/><cc:attributionName>Mon Vidangeur – monvidangeur.fr</cc:attributionName><cc:attributionURL rdf:resource="https://monvidangeur.fr/schemas-libres/vidange-niveaux-de-boues/"/></cc:Work></rdf:RDF></metadata><defs><marker id="fl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1747a6"/></marker><marker id="c" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="#4a5868" stroke-width="1.5"/></marker><pattern id="grav" width="14" height="12" patternUnits="userSpaceOnUse"><rect width="14" height="12" fill="#b8b8b0"/><circle cx="4" cy="4" r="2.4" fill="#8a8a82"/><circle cx="11" cy="9" r="2" fill="#8a8a82"/></pattern><pattern id="sab" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#f3e2a6"/><circle cx="2" cy="3" r="1" fill="#b89b4a"/><circle cx="6.5" cy="7" r="1" fill="#b89b4a"/></pattern></defs><rect width="960" height="640" fill="#ffffff"/><rect x="0" y="0" width="960" height="52" fill="#0b1f3a" stroke="none" stroke-width="0"/><text x="24" y="34" font-size="22" text-anchor="start" font-weight="bold" fill="#ffffff">Vidange d'une fosse : niveaux de boues</text><rect x="810" y="14" width="126" height="24" rx="12" fill="#ffc233"/><text x="873" y="31" font-size="12" text-anchor="middle" font-weight="bold" fill="#0b1f3a">Schéma de principe</text><rect x="0" y="175" width="960" height="419" fill="#e9dcc3" stroke="none" stroke-width="0"/><line x1="0" y1="175" x2="960" y2="175" stroke="#6b8f3a" stroke-width="4"/><rect x="300" y="205" width="420" height="300" fill="#d9dee5" stroke="#0b1f3a" stroke-width="4"/><rect x="304" y="265" width="412" height="236" fill="#cfe3f5" stroke="none" stroke-width="0"/><rect x="304" y="265" width="412" height="26" fill="#a58f6a" stroke="none" stroke-width="0"/><rect x="304" y="383.0" width="412" height="118.0" fill="#7a5c3e" stroke="none" stroke-width="0"/><path d="M304,383.0 q30,-8 60,0 t60,0 t60,0 t60,0 t60,0 t60,0 t52,0" fill="none" stroke="#5b4430" stroke-width="2"/><line x1="304" y1="383.0" x2="716" y2="383.0" stroke="#ffc233" stroke-width="4" stroke-dasharray="12 6"/><polyline points="0,250 340,250" fill="none" stroke="#0b1f3a" stroke-width="7"/><line x1="340" y1="235" x2="340" y2="335" stroke="#0b1f3a" stroke-width="4"/><polyline points="680,265 720,265 " fill="none" stroke="#0b1f3a" stroke-width="2"/><polyline points="680,265 840,265" fill="none" stroke="#0b1f3a" stroke-width="7"/><line x1="680" y1="235" x2="680" y2="335" stroke="#0b1f3a" stroke-width="4"/><text x="10" y="240" font-size="11" text-anchor="start" font-weight="normal" fill="#4a5868" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">entrée des eaux usées</text><text x="840" y="255" font-size="11" text-anchor="end" font-weight="normal" fill="#4a5868" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">sortie vers le traitement</text><rect x="470" y="169" width="80" height="12" fill="#4a5868" stroke="none" stroke-width="0"/><line x1="470" y1="205" x2="470" y2="175" stroke="#0b1f3a" stroke-width="3"/><line x1="550" y1="205" x2="550" y2="175" stroke="#0b1f3a" stroke-width="3"/><path d="M510,475 L510,155 Q510,105 580,105 L820,105" fill="none" stroke="#0b1f3a" stroke-width="9" stroke-linecap="round"/><rect x="820" y="70" width="120" height="70" fill="#ffc233" stroke="#0b1f3a" stroke-width="2"/><text x="880" y="100" font-size="12" text-anchor="middle" font-weight="bold" fill="#0b1f3a">camion de</text><text x="880" y="116" font-size="12" text-anchor="middle" font-weight="bold" fill="#0b1f3a">vidange</text><text x="530" y="95" font-size="12" text-anchor="start" font-weight="bold" fill="#1747a6" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">aspiration par un vidangeur agréé par le préfet</text><line x1="270" y1="265" x2="270" y2="501" stroke="#4a5868" stroke-width="1.5" marker-start="url(#c)" marker-end="url(#c)"/><text x="270.0" y="383.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#0b1f3a" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"></text><text x="260" y="365.0" font-size="11" text-anchor="end" font-weight="bold" fill="#0b1f3a" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"><tspan x="260" dy="0">volume utile :</tspan><tspan x="260" dy="13.8">du fond au niveau</tspan><tspan x="260" dy="13.8">inférieur de l'orifice</tspan><tspan x="260" dy="13.8">de sortie ;</tspan><tspan x="260" dy="13.8">hauteur utile d'eau</tspan><tspan x="260" dy="13.8">≥ 1 m</tspan></text><text x="410" y="283" font-size="12" text-anchor="middle" font-weight="bold" fill="#ffffff">matières flottantes (chapeau)</text><text x="410" y="335" font-size="12" text-anchor="middle" font-weight="bold" fill="#0b1f3a" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">zone liquide</text><text x="410" y="443.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#ffffff">boues accumulées</text><text x="734" y="379.0" font-size="11" text-anchor="start" font-weight="bold" fill="#0b1f3a" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"><tspan x="734" dy="0">repère 50 % du volume</tspan><tspan x="734" dy="13.8">utile (cuve de section</tspan><tspan x="734" dy="13.8">constante) : vidanger</tspan><tspan x="734" dy="13.8">au plus tard ici</tspan></text><line x1="716" y1="383.0" x2="730" y2="383.0" stroke="#ffc233" stroke-width="4"/><text x="24" y="548" font-size="11" text-anchor="start" font-weight="normal" fill="#1c2733" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"><tspan x="24" dy="0">Art. 15 : la hauteur de boues ne doit pas dépasser 50 % du volume utile, sauf mention contraire dans l'avis d'agrément du dispositif.</tspan><tspan x="24" dy="13.8">À chaque vidange, le vidangeur agréé remet un bordereau de suivi des matières de vidange (arrêté « agrément » du 7/09/2009, art. 9).</tspan></text><rect x="0" y="594" width="960" height="46" fill="#f1f5fb" stroke="none" stroke-width="0"/><line x1="0" y1="594" x2="960" y2="594" stroke="#d5dde1" stroke-width="1"/><text x="24" y="614" font-size="12" text-anchor="start" font-weight="bold" fill="#0b1f3a" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Schéma : Mon Vidangeur – monvidangeur.fr · Licence CC BY 4.0 (réutilisation libre avec ce crédit et un lien)</text><text x="24" y="630" font-size="11" text-anchor="start" font-weight="normal" fill="#4a5868" paint-order="stroke" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">Source : arrêté du 7/09/2009 modifié (prescriptions techniques), art. 15 et annexe 1 ; arrêté du 7/09/2009 modifié (agrément des vidangeurs), art. 9 · sans échelle sauf mention</text></svg>
